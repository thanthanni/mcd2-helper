<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>마인크래프트 던전스 2 빌드 도우미</title>
<style>
:root{--bg:#15171c;--card:#1e222a;--line:#2d3340;--tx:#e8eaf0;--mut:#8b93a5;--ac:#6ee7a0;--S:#ff6b6b;--A:#ffb347;--B:#ffe066;--C:#8ecbff;--D:#9aa0ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Malgun Gothic",sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0}nav button{background:none;border:1px solid var(--line);color:var(--tx);padding:7px 14px;border-radius:8px;cursor:pointer;margin-right:6px}
nav button.on{background:var(--ac);color:#0b1f13;border-color:var(--ac);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.slot h3{margin:0 0 6px;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.5px}
.pick{width:100%;text-align:left;background:#12151a;border:1px dashed var(--line);color:var(--tx);border-radius:8px;padding:8px;cursor:pointer;min-height:40px}
.pick.filled{border-style:solid}.pick small{display:block;color:var(--mut)}
.ench{display:flex;gap:4px;margin-top:6px}.ench button{flex:1;background:#12151a;border:1px dashed var(--line);color:var(--mut);border-radius:6px;padding:4px;cursor:pointer;font-size:12px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ench button.filled{color:var(--tx);border-style:solid}
.lv{display:flex;gap:2px;margin-top:3px}.lv span{flex:1;text-align:center;font-size:11px;padding:1px;border-radius:4px;background:#12151a;cursor:pointer;color:var(--mut)}.lv span.on{background:var(--ac);color:#0b1f13;font-weight:700}
.badge{display:inline-block;min-width:18px;text-align:center;border-radius:4px;font-size:11px;font-weight:800;color:#111;padding:0 4px;margin-right:6px}
.badge.S{background:var(--S)}.badge.A{background:var(--A)}.badge.B{background:var(--B)}.badge.C{background:var(--C)}.badge.D{background:var(--D)}.badge.none{background:#3a4152;color:#9aa0ad}
.unique{color:#ffd166}.rare{color:#8ecbff}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:14px}
.sum h2{margin:0 0 8px;font-size:15px}.sum li{margin:3px 0}.sum small{color:var(--mut)}
.bar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.bar button,.bar input,.bar select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit}
.bar button{cursor:pointer}.bar input{flex:1;min-width:160px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
.modal.on{display:flex}.box{background:var(--card);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:86vh;display:flex;flex-direction:column}
.box header{border:0;padding:10px}.box input{flex:1;background:#12151a;border:1px solid var(--line);color:var(--tx);padding:9px;border-radius:8px;font:inherit}
.list{overflow:auto;padding:0 10px 10px}.row{padding:8px;border-radius:8px;cursor:pointer;border-bottom:1px solid #262b36}
.row:hover{background:#262c38}.row .e{color:var(--mut);font-size:13px}
.warn{color:#ffb347}.note{color:var(--mut);font-size:12px;margin-top:14px}
.dex .row{cursor:default}.dex .row:hover{background:none}
</style></head><body>
<header><h1>마크 던전스 2 빌드 도우미</h1><nav><button id="t-build" class="on">빌드 짜기</button><button id="t-dex">도감</button></nav></header>
<main>
<section id="p-build">
 <div class="bar"><button id="share">링크 복사</button><button id="reset">전부 비우기</button><span id="msg" style="align-self:center;color:var(--ac)"></span></div>
 <div class="grid" id="slots"></div>
 <div class="sum"><h2>이 빌드의 효과 모음</h2><div id="sum"></div></div>
</section>
<section id="p-dex" style="display:none" class="dex">
 <div class="bar"><select id="dcat"></select><input id="dq" placeholder="이름이나 효과로 검색 (영어 이름도 돼)"><select id="dtier"><option value="">등급 전체</option><option>S</option><option>A</option><option>B</option><option>C</option><option>D</option></select></div>
 <div id="dlist"></div>
</section>
<p class="note">한국어 이름·효과는 게임 안 한국어 텍스트(metabot.gg 정리본), S~D 등급은 dungeonsdb.com 티어표야. 2026-10 기준이라 패치로 바뀔 수 있어. 인챈트는 장비 한 칸에 하나씩 넣는 걸로 해 뒀어.</p>
</main>
<div class="modal" id="modal"><div class="box"><header><input id="mq" placeholder="검색"><button class="bar" id="mclose" style="background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 12px;cursor:pointer">닫기</button></header><div class="list" id="mlist"></div></div></div>
<script>
const DATA={"weapons": [{"id": "awesomeaxe", "name": "대단한 거대 도끼", "tier": "S", "rarity": "unique", "effect": "강화의 일격: 공격이 적중할 경우 6% 확률로 힘 상태를 부여합니다.", "flavor": "왜 굳이 거대 도끼에 만족해야 할까요?", "type": "melee", "hit": "30", "dps": "33.1", "weight": "중량", "en": "Awesomeaxe"}, {"id": "heartbreaker", "name": "하트브레이커", "tier": "S", "rarity": "unique", "effect": "화약술: 이 무기로 가하는 공격이 적중하면 폭발합니다!", "flavor": "내려치면 폭발하는 화염 마법이 깃든, 네더라이트 전쟁 망치입니다.", "type": "melee", "hit": "40", "dps": "41.6", "weight": "중량", "en": "Heartbreaker"}, {"id": "redstone-wrecker", "name": "레드스톤 파괴자", "tier": "S", "rarity": "unique", "effect": "발화: 파도가 몹에게 무기 피해의 80%에 해당하는 피해를 가하고 잠시 불태웁니다.", "flavor": "괴물의 일부를 가져와 기발한 화염 공학을 활용한 파괴용으로 개조한 무기입니다.", "type": "melee", "hit": "35", "dps": "27.9", "weight": "중량", "en": "Redstone Wrecker"}, {"id": "prime-enchanter-s-gauntlets", "name": "프라임 마법 부여사의 건틀릿", "tier": "S", "rarity": "unique", "effect": "얼음 번개: 점프 공격 시 번개와 얼음 파도를 생성해 적에게 피해를 줍니다.", "flavor": "한쪽은 전기가 파지직 튀어 오르고, 다른 한쪽에는 얼음 마법이 부여되어 있습니다. 두 쪽 다 한 방을 날릴 준비가 되어 있습니다.", "type": "melee", "hit": "14", "dps": "35.3", "en": "Prime Enchanter's Gauntlets", "weight": ""}, {"id": "war-hammer", "name": "전쟁 망치", "tier": "S", "rarity": "common", "effect": "", "flavor": "그 일격이 대지를 울려, 적의 심장에까지 전해집니다.", "type": "melee", "hit": "40", "dps": "41.6", "weight": "중량", "en": "War Hammer"}, {"id": "mace", "name": "철퇴", "tier": "S", "rarity": "common", "effect": "", "flavor": "잔혹한 전쟁 도구입니다. 정교함이 부족하지만, 압도적인 파워가 그 부족함을 채워줍니다.", "type": "melee", "hit": "24", "dps": "29.8", "weight": "중형", "en": "Mace"}, {"id": "short-spear", "name": "단창", "tier": "S", "rarity": "common", "effect": "", "flavor": "이 단창은 주인만 제대로 만난다면 차원을 넘어서까지 닿을 수 있습니다.", "type": "melee", "hit": "20", "dps": "48.6", "weight": "중형", "en": "Short Spear"}, {"id": "rascal-s-razor", "name": "악동의 면도날", "tier": "A", "rarity": "unique", "effect": "곡예사: 구르기 쿨타임이 40% 감소합니다.", "flavor": "진흙에서 구르기를 좋아하는 장난기 많은 전사를 위한 무기입니다.", "type": "melee", "hit": "22", "dps": "35.3", "weight": "중형", "en": "Rascal's Razor"}, {"id": "spectral-spear", "name": "혼령 창", "tier": "A", "rarity": "unique", "effect": "이코르 폭발: 파도가 무기 피해의 90%에 해당하는 피해를 가하고 잠시 추가 영혼 피해를 가합니다.", "flavor": "이코르로 벼려내었으며, 영혼들이 깃든 이 창은 당신이 겨누는 모든 적을 불태웁니다.", "type": "melee", "hit": "20", "dps": "53.4", "weight": "중형", "en": "Spectral Spear"}, {"id": "venomous-fangs", "name": "맹독 송곳니", "tier": "A", "rarity": "unique", "effect": "독약술사: 독 공격이 20%의 추가 피해를 가합니다.", "flavor": "독을 바른 단검으로, 거미가 무는 것만큼이나 치명적인 일격을 가할 수 있습니다.", "type": "melee", "hit": "9", "dps": "29.3", "weight": "경량", "en": "Venomous Fangs"}, {"id": "clobberer", "name": "후려치는 몽둥이", "tier": "A", "rarity": "common", "effect": "", "flavor": "보다 직접적인 문제 해결 방식을 선호하는 이들을 위한 것입니다.", "type": "melee", "hit": "35", "dps": "25", "weight": "중량", "en": "Clobberer"}, {"id": "pickaxe", "name": "곡괭이", "tier": "A", "rarity": "common", "effect": "", "flavor": "아득한 옛날부터 모험가와 영웅의 상징이 되어 온 도구입니다.", "type": "melee", "hit": "24", "dps": "31.4", "weight": "중형", "en": "Pickaxe"}, {"id": "claymore", "name": "클레이모어", "tier": "A", "rarity": "common", "effect": "", "flavor": "정의로운 전사의 손에 착 감기는 거대한 검입니다.", "type": "melee", "hit": "25", "dps": "31.3", "weight": "중량", "en": "Claymore"}, {"id": "battle-hammer", "name": "전투 망치", "tier": "A", "rarity": "common", "effect": "", "flavor": "쇠가 달아올라 있을 때 내리쳐야 합니다.", "type": "melee", "hit": "25", "dps": "31", "weight": "중형", "en": "Battle Hammer"}, {"id": "shovel", "name": "삽", "tier": "A", "rarity": "common", "effect": "", "flavor": "복수를 계획할 때는 무덤을 2개 파야 합니다. 하나는 적을 위한 것이고 또 하나는... 당신의 또 다른 적을 위한 것이죠.", "type": "melee", "hit": "60", "dps": "34.9", "weight": "중량", "en": "Shovel"}, {"id": "greataxe", "name": "거대 도끼", "tier": "A", "rarity": "common", "effect": "", "flavor": "괜찮은 도끼는 한쪽에만 날이 있어도 충분하다고 여겨지죠. 이건 '괜찮은' 정도를 넘어서는 도끼입니다.", "type": "melee", "hit": "30", "dps": "33.1", "weight": "중량", "en": "Greataxe"}, {"id": "greatsword", "name": "대검", "tier": "A", "rarity": "common", "effect": "", "flavor": "마음이 정의롭기만 하다면, 아무리     row.innerHTML=`<div class="ench"><button class="${en?'filled':''}">${en?`${badge(en.tier)}${en.name}`:'+ 인챈트'}</button></div>`+(en?`<div class="lv">${[1,2,3].map(l=>`<span class="${(ce.l||1)==l?'on':''}" data-l="${l}">${'I'.repeat(l)}</span>`).join('')}</div>`:'');
    row.querySelector('button').onclick=()=>openPicker('인챈트',DATA.enchantments.filter(e=>fits(e,s)),x=>{cur.e=cur.e||[];cur.e[n]=x?{id:x.id,l:3}:null;st[s.k]=cur;save();render()},true);
    row.querySelectorAll('.lv span').forEach(sp=>sp.onclick=()=>{ce.l=+sp.dataset.l;save();render()});
    w.appendChild(row);
   }
   d.appendChild(w);
  }
  el.appendChild(d);
 }
 summary();
}
function summary(){
 const L=[],warn=[];const seen={};
 for(const s of SLOTS){
  const cur=st[s.k]||{};const it=cur.i&&byId[s.cat+':'+cur.i];if(!it)continue;
  if(seen[s.cat+it.id])warn.push(`${it.name}이(가) 두 번 들어갔어.`);seen[s.cat+it.id]=1;
  if(it.effect)L.push(`<li>${badge(it.tier)}<b>${it.name}</b> — ${it.effect}</li>`);
  for(const ce of (cur.e||[])){if(!ce)continue;const en=ench[ce.id];if(!en)continue;const l=ce.l||3;
   L.push(`<li>&nbsp;&nbsp;↳ ${badge(en.tier)}<b>${en.name} ${'I'.repeat(l)}</b> (${it.name}) — ${en.tiers?en.tiers[l-1]:en.desc}</li>`);}
 }
 const sets={};for(const k of['helmet','chest','legs','boots']){const c=st[k];const it=c&&c.i&&byId['armor:'+c.i];if(it&&it.set)sets[it.set]=(sets[it.set]||0)+1}
 const setTxt=Object.entries(sets).map(([n,c])=>`${n} 세트 ${c}/4`).join(', ');
 $('#sum').innerHTML=(L.length?`<ul>${L.join('')}</ul>`:'<small>위에서 장비를 고르면 효과가 여기 모여.</small>')+(setTxt?`<p><small>세트: ${setTxt}</small></p>`:'')+warn.map(w=>`<p class="warn">⚠ ${w}</p>`).join('');
}
let pickCb,pickList,pickEn;
function openPicker(title,list,cb,isEn){
 pickCb=cb;pickList=list.slice().sort((a,b)=>'SABCD'.indexOf(a.tier||'Z')-'SABCD'.indexOf(b.tier||'Z')||a.name.localeCompare(b.name));pickEn=isEn;
 $('#mq').value='';$('#modal').classList.add('on');$('#mq').placeholder=title+' 검색';drawPick();$('#mq').focus();
}
function drawPick(){
 const q=$('#mq').value.toLowerCase();
 const r=pickList.filter(i=>!q||(i.name+' '+(i.en||'')+' '+(i.effect||i.desc||'')).toLowerCase().includes(q));
 $('#mlist').innerHTML=`<div class="row" data-n="-1"><span class="e">비우기</span></div>`+r.map((i,n)=>`<div class="row" data-n="${pickList.indexOf(i)}">${badge(i.tier)}<b class="${i.rarity||''}">${i.name}</b><div class="e">${i.effect||i.desc||''}</div></div>`).join('');
 document.querySelectorAll('#mlist .row').forEach(rw=>rw.onclick=()=>{const n=+rw.dataset.n;$('#modal').classList.remove('on');pickCb(n<0?null:pickList[n])});
}
$('#mq').oninput=drawPick;$('#mclose').onclick=()=>$('#modal').classList.remove('on');
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')};
$('#reset').onclick=()=>{if(confirm('전부 비울까?')){st={};save();history.replaceState(0,'',location.pathname);render()}};
$('#share').onclick=()=>{const h=btoa(unescape(encodeURIComponent(JSON.stringify(st))));const u=location.origin+location.pathname+'#'+h;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>$('#msg').textContent='복사됨',()=>{prompt('이 링크를 복사해',u)});};
// 도감
const CATS={weapons:'무기',armor:'방어구',artifacts:'유물',talismans:'부적',enchantments:'인챈트'};
$('#dcat').innerHTML=Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
function dex(){
 const c=$('#dcat').value,q=$('#dq').value.toLowerCase(),t=$('#dtier').value;
 const r=DATA[c].filter(i=>(!t||i.tier===t)&&(!q||JSON.stringify(i).toLowerCase().includes(q))).sort((a,b)=>'SABCD'.indexOf(a.tier||'Z')-'SABCD'.indexOf(b.tier||'Z')||a.name.localeCompare(b.name));
 $('#dlist').innerHTML=`<small>${r.length}개</small>`+r.map(i=>{
  const AP={'Melee weapon':'근접','Ranged weapon':'원거리','Helmet':'투구','Chest':'가슴','Leggings':'각반','Boots':'부츠'};
  const meta=[i.type==='melee'?'근접':i.type==='ranged'?'원거리':'',i.slot,i.set&&i.set+' 세트',i.hit&&'타격 '+i.hit,i.dps&&'DPS '+i.dps,i.weight,i.souls&&`영혼 ${i.souls}`,i.cooldown&&`쿨 ${i.cooldown}`,i.applies!==undefined&&('대상: '+(i.applies?i.applies.split(', ').map(a=>AP[a]||a).join('·'):'방어구'))].filter(Boolean).join(' · ');
  const eff=i.tiers?i.tiers.map((x,n)=>`${'I'.repeat(n+1)}: ${x}`).join('<br>')+(i.uniq?`<br>유일: ${i.uniq}`:''):(i.effect||i.desc||'');
  return `<div class="row">${badge(i.tier)}<b class="${i.rarity||''}">${i.name}</b> <small>${meta}</small><div class="e">${eff}${i.flavor?`<br><i>${i.flavor}</i>`:''}</div></div>`}).join('');
}
['dcat','dq','dtier'].forEach(id=>$('#'+id).oninput=dex);
$('#t-build').onclick=()=>{$('#p-build').style.display='';$('#p-dex').style.display='none';$('#t-build').classList.add('on');$('#t-dex').classList.remove('on')};
$('#t-dex').onclick=()=>{$('#p-build').style.display='none';$('#p-dex').style.display='';$('#t-dex').classList.add('on');$('#t-build').classList.remove('on');dex()};
render();
</script></body></html>
